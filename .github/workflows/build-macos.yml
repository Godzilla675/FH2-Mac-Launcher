name: Build & Release Forza Horizon 2 macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw-w64 and sevenzip
        run: |
          brew install mingw-w64 sevenzip

      - name: Build DLLs, SwiftUI App, Icon, DMG and ZIP
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          chmod +x tools/build_release.sh
          ./tools/build_release.sh "$VERSION"

      - name: Package App Bundle with ditto
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Forza Horizon 2.app" "dist/Forza-Horizon-2-Mac-App.zip"
          ls -lh "dist/Forza-Horizon-2-Mac-App.zip"

      - name: Verify App Bundle Payload and Code Signature
        run: |
          ls -la "dist/Forza Horizon 2.app/Contents/MacOS/FH2Launcher"
          ls -la "dist/Forza Horizon 2.app/Contents/Resources/manifest.json"
          ls -la "dist/Forza Horizon 2.app/Contents/Resources/bin/7zz"
          ls -la "dist/Forza Horizon 2.app/Contents/Resources/payload/layer/"
          ls -la "dist/Forza Horizon 2.app/Contents/Resources/payload/azimuth-0.9.10/"
          ls -la "dist/Forza Horizon 2.app/Contents/Resources/payload/azimuth-1.0.1/"
          ls -la "dist/Forza Horizon 2.app/Contents/Resources/payload/extra_options/"
          file "dist/Forza Horizon 2.app/Contents/MacOS/FH2Launcher"
          file "dist/Forza Horizon 2.app/Contents/Resources/bin/7zz"
          file "dist/Forza Horizon 2.app/Contents/Resources/payload/layer/d3d12.dll"
          file "dist/Forza Horizon 2.app/Contents/Resources/payload/layer/fh2pad.dll"
          file "dist/Forza Horizon 2.app/Contents/Resources/payload/layer/d3dcompiler_47.dll"
          file "dist/Forza Horizon 2.app/Contents/Resources/payload/layer/noop.exe"
          codesign --verify --deep --strict --verbose=2 "dist/Forza Horizon 2.app"

      - name: Run Lightweight Self-Test & GUI Launch Test
        run: |
          echo "=== 1. Running Fast Mock/Lightweight Self-Test Suite ==="
          "dist/Forza Horizon 2.app/Contents/MacOS/FH2Launcher" --self-test

          echo "=== 2. Running Live macOS GUI Window Launch Test (5s stability check) ==="
          rm -f "$HOME/Library/Logs/FH2Port/launcher.log"
          "dist/Forza Horizon 2.app/Contents/MacOS/FH2Launcher" &
          GUI_PID=$!
          sleep 5
          if ! kill -0 "$GUI_PID" 2>/dev/null; then
            echo "ERROR: FH2Launcher GUI process ($GUI_PID) exited or crashed!"
            exit 1
          fi
          echo "[PASS] FH2Launcher GUI process (PID $GUI_PID) is alive and stable after 5 seconds."
          kill -TERM "$GUI_PID" 2>/dev/null || true
          wait "$GUI_PID" 2>/dev/null || true
          if [ -f "$HOME/Library/Logs/FH2Port/launcher.log" ]; then
            cat "$HOME/Library/Logs/FH2Port/launcher.log"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forza-Horizon-2-Mac-App
          path: |
            dist/Forza-Horizon-2-Mac-App.zip
            dist/Forza-Horizon-2-Mac-Installer.dmg
            dist/Forza-Horizon-2-Setup.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          TAG="v${VERSION}"
          echo "Publishing release for tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/Forza-Horizon-2-Mac-App.zip" \
              "dist/Forza-Horizon-2-Mac-Installer.dmg" \
              "dist/Forza-Horizon-2-Setup.dmg" \
              --clobber
            gh release edit "$TAG" --latest --notes-file README.md
          else
            gh release create "$TAG" \
              "dist/Forza-Horizon-2-Mac-App.zip" \
              "dist/Forza-Horizon-2-Mac-Installer.dmg" \
              "dist/Forza-Horizon-2-Setup.dmg" \
              --title "Forza Horizon 2 — macOS Apple Silicon 1-Click A-to-Z Installer & Launcher (v${VERSION})" \
              --notes-file README.md \
              --latest
          fi
